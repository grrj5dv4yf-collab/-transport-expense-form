      "parking-days-label": "利用日数",
      "parking-monthly-fee-label": "月額",
      "parking-error": "駐輪場の利用区分を選択してください。",
      "parking-fee-error": "金額を入力してください。",
      "parking-days-error": "利用日数を入力してください。",
      "parking-monthly-error": "月額を入力してください。",
      "add-route-button-label": "現場・経路を追加",
      "route-limit-message": "現場・経路は最大4件まで追加できます。",
      "review-button-label": "入力内容を確認する",
      "review-heading": "申請内容の確認",
      "review-description": "内容を確認して、問題なければ申請してください。",
      "back-button": "入力画面に戻る",
      "submit-button": "この内容で申請する",
      "complete-heading": "申請が完了しました",
      "complete-description": "申請内容をこの端末に保存しました。CSVが必要な場合は下のボタンから出力できます。",
      "csv-button-label": "CSVを出力する",
      "site-label": "現場名",
      "other-site-label": "現場名を入力",
      "site-error": "現場を選択してください。",
      "trip-label": "利用区分（片道・往復・定期）",
      "trip-error": "利用区分を選択してください。",
      "usage-date-label": "利用日・定期期間",
      "period-start-label": "定期開始日",
      "period-end-label": "定期終了日",
      "dates-error": "利用日または定期期間を入力してください。",
      "transport-label": "交通手段",
      "transport-error": "交通手段を選択してください。",
      "boarding-label": "乗車駅・停留所（乗る場所）",
      "boarding-error": "乗車駅・停留所を入力してください。",
      "alighting-label": "降車駅・停留所（降りる場所）",
      "alighting-error": "降車駅・停留所を入力してください。",
      "fare-label": "運賃",
      "fare-error": "運賃を入力してください。",
      "remarks-label": "備考",
      "remarks-help": "必要な場合のみ入力してください。"
    };
    function applyLabels(root = document) {
      Object.entries(labels).forEach(([id, text]) => {
        const elements = root.querySelectorAll(`[data-template-id="${id}"]`);
        elements.forEach(el => { el.textContent = text; });
      });
    }
    applyLabels();

    let routeCounter = 0;
    let submittedRows = [];
    let dataReady = false;

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

    function initialMonth() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    }

    function monthLabel(monthValue) {
      const [year, month] = monthValue.split("-").map(Number);
      return `${year}年${month}月`;
    }

    function formatDate(dateText) {
      const date = new Date(dateText + "T00:00:00");
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function clearFieldError(el) {
      if (el) el.classList.remove("has-error");
    }

    function setFieldError(card, field, invalid) {
      const el = card.querySelector(`[data-field="${field}"]`);
      if (el) el.classList.toggle("has-error", invalid);
      return !invalid;
    }

    function selectedRadio(card, group) {
      return card.querySelector(`input[data-group="${group}"]:checked`)?.value || "";
    }

    function addRoute() {
      if (routes.length >= 4) return;
      routeCounter += 1;
      const fragment = $("#route-template").content.cloneNode(true);
      const card = fragment.querySelector(".route-card");
      const id = `route-${routeCounter}`;
      card.dataset.routeId = id;
      $(".route-heading", card).textContent = `現場・経路${toJapaneseNumber(routeCounter)}`;
      // template内の「何を入力する欄か」を複製後にも表示する
      applyLabels(card);

      $$('input[type="radio"]', card).forEach(input => {
        const area = input.closest('[data-field]')?.dataset.field || "parking";
        input.name = `${id}-${area}`;
        input.dataset.group = area === "site" ? "site" : area === "transport" ? "transport" : area === "trip" ? "trip" : "parking";
      });

      const route = { id, card, selectedDates: [], displayMonth: $("#target-month").value || initialMonth() };
      routes.push(route);
      $("#route-list").appendChild(card);

      $(".remove-route", card).classList.toggle("hidden", routes.length === 1);
      card.addEventListener("change", event => handleCardChange(route, event));
      $(".calendar-prev", card).addEventListener("click", () => moveMonth(route, -1));
      $(".calendar-next", card).addEventListener("click", () => moveMonth(route, 1));
      $(".remove-route", card).addEventListener("click", () => removeRoute(route.id));

      renderCalendar(route);
      updateAddRouteState();
    }

    function toJapaneseNumber(number) {
      return ["", "①", "②", "③", "④"][number] || number;
    }

    function removeRoute(id) {
      const index = routes.findIndex(route => route.id === id);
      if (index < 0) return;
      routes[index].card.remove();
      routes.splice(index, 1);
      routes.forEach((route, idx) => {
        $(".route-heading", route.card).textContent = `現場・経路${toJapaneseNumber(idx + 1)}`;
        $(".remove-route", route.card).classList.toggle("hidden", routes.length === 1);
      });
      updateAddRouteState();
    }

    function updateAddRouteState() {
      const atLimit = routes.length >= 4;
      $("#add-route-button").disabled = atLimit;
      $("#add-route-button").classList.toggle("opacity-50", atLimit);
      $("#route-limit-message").classList.toggle("hidden", !atLimit);
    }

    function handleCardChange(route, event) {
      const card = route.card;
      if (event.target.matches('input[data-group="trip"]')) {
        const isPeriod = event.target.value === "定期";
        $(".period-inputs", card).classList.toggle("hidden", !isPeriod);
        $(".calendar-inputs", card).classList.toggle("hidden", isPeriod);
        $(".selected-dates", card).classList.toggle("hidden", isPeriod);
        clearFieldError(card.querySelector('[data-field="dates"]'));
      }
      if (event.target.matches('input[data-group="site"]')) {
        $(".other-site", card).classList.toggle("hidden", event.target.value !== "その他");
        clearFieldError(card.querySelector('[data-field="site"]'));
      }
      if (event.target.matches('input[data-group="parking"]')) {
        const type = event.target.value;
        $(".parking-daily", card).classList.toggle("hidden", type !== "日払い");
        $(".parking-monthly", card).classList.toggle("hidden", type !== "月額");
        clearFieldError(card.querySelector(".border-t"));
      }
      if (event.target.matches("input")) {
        clearFieldError(event.target.closest("[data-field]"));
      }
    }

    function moveMonth(route, offset) {
      const [year, month] = route.displayMonth.split("-").map(Number);
      const next = new Date(year, month - 1 + offset, 1);
      route.displayMonth = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}`;
      renderCalendar(route);
    }

    function renderCalendar(route) {
      const card = route.card;
      const [year, month] = route.displayMonth.split("-").map(Number);
      const grid = $(".calendar-grid", card);
      $(".calendar-month", card).textContent = `${year}年${month}月`;
      grid.innerHTML = "";

      const firstDay = new Date(year, month - 1, 1).getDay();
      const lastDate = new Date(year, month, 0).getDate();
      const today = new Date();
      const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;

      for (let i = 0; i < firstDay; i++) {
        const blank = document.createElement("div");
        blank.className = "calendar-blank";
        grid.appendChild(blank);
      }
      for (let day = 1; day <= lastDate; day++) {
        const key = `${route.displayMonth}-${String(day).padStart(2, "0")}`;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "calendar-day" + (route.selectedDates.includes(key) ? " selected" : "") + (key === todayKey ? " today" : "");
        button.textContent = day;
        button.setAttribute("aria-pressed", String(route.selectedDates.includes(key)));
        button.addEventListener("click", () => {
          const index = route.selectedDates.indexOf(key);
          if (index >= 0) route.selectedDates.splice(index, 1);
          else route.selectedDates.push(key);
          route.selectedDates.sort();
          setFieldError(card, "dates", false);
          renderCalendar(route);
        });
        grid.appendChild(button);
      }
      renderSelectedDates(route);
    }

    function renderSelectedDates(route) {
      const target = $(".selected-dates", route.card);
      target.innerHTML = "";
      const title = document.createElement("strong");
      title.textContent = "選択中：";
      target.appendChild(title);
      const text = document.createElement("span");
      text.textContent = route.selectedDates.length ? route.selectedDates.map(formatDate).join("、") : "日付をタップして選択してください";
      target.appendChild(text);
    }

    function getRouteData(route) {
      const card = route.card;
      const siteValue = selectedRadio(card, "site");
      const siteName = siteValue === "その他" ? $(".other-site-input", card).value.trim() : siteValue;
      const parkingCard = $("#parking-card");
      const parkingType = selectedRadio(parkingCard, "parking");
      const daily = $(".parking-daily", parkingCard);
      const monthly = $(".parking-monthly", parkingCard);
      const parkingFee = parkingType === "日払い"
        ? Number($(".parking-fee-input", daily).value || 0)
        : parkingType === "月額" ? Number($(".parking-fee-input", monthly).value || 0) : 0;

      return {
        route,
        siteValue,
        siteName,
        dates: route.selectedDates,
        periodStart: $(".period-start-input", card).value,
        periodEnd: $(".period-end-input", card).value,
        transportType: selectedRadio(card, "transport"),
        boardingStation: $(".boarding-input", card).value.trim(),
        alightingStation: $(".alighting-input", card).value.trim(),
        tripType: selectedRadio(card, "trip"),
        fare: Number($(".fare-input", card).value || 0),
        parkingType,
        parkingFee,
        parkingDays: parkingType === "日払い" ? Number($(".parking-days-input", card).value || 0) : 0,
        remarks: $("#remarks-input", card).value.trim()
      };
    }

    function validateForm() {
      let valid = true;
      const employee = $("#employee-name").value.trim();
      const month = $("#target-month").value;
      valid = setFieldError($("#basic-info-card"), "employee_name", !employee) && valid;
      valid = setFieldError($("#basic-info-card"), "target_month", !month) && valid;

      routes.forEach(route => {
        const data = getRouteData(route);
        const card = route.card;
        valid = setFieldError(card, "site", !data.siteValue || (data.siteValue === "その他" && !data.siteName)) && valid;
        const isPeriod = data.tripType === "定期";
        const validPeriod = !isPeriod || (data.periodStart && data.periodEnd && data.periodStart <= data.periodEnd);
        valid = setFieldError(card, "dates", isPeriod ? !validPeriod : !data.dates.length) && valid;
        valid = setFieldError(card, "transport", !data.transportType) && valid;
        valid = setFieldError(card, "boarding", !data.boardingStation) && valid;
        valid = setFieldError(card, "alighting", !data.alightingStation) && valid;
        valid = setFieldError(card, "trip", !data.tripType) && valid;
        valid = setFieldError(card, "fare", !Number.isFinite(data.fare) || data.fare <= 0) && valid;
      });
      const parkingData = getRouteData(routes[0]);
      const parkingCard = $("#parking-card");
      valid = setFieldError(parkingCard, "parking", !parkingData.parkingType) && valid;
      if (parkingData.parkingType === "日払い") {
        valid = setFieldError(parkingCard, "parking_fee_daily", parkingData.parkingFee <= 0) && valid;
        valid = setFieldError(parkingCard, "parking_days", parkingData.parkingDays <= 0) && valid;
      }
      if (parkingData.parkingType === "月額") {
        valid = setFieldError(parkingCard, "parking_fee_monthly", parkingData.parkingFee <= 0) && valid;
      }
      /* validation above covers the shared parking section */
      return valid;
    }

    function showReview() {
      if (!validateForm()) {
        document.querySelector(".has-error")?.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      const employee = $("#employee-name").value.trim();
      const month = $("#target-month").value;
      const content = $("#review-content");
      content.innerHTML = "";

      const basic = document.createElement("section");
      basic.className = "surface-card rounded-2xl bg-white p-5";
      basic.innerHTML = `<h3 class="font-bold">基本情報</h3><div class="summary-row mt-3"><span class="text-slate-500">社員名</span><p class="mt-1 font-semibold"></p></div><div class="summary-row"><span class="text-slate-500">精算対象月</span><p class="mt-1 font-semibold"></p></div>`;
      basic.querySelectorAll("p")[0].textContent = employee;
      basic.querySelectorAll("p")[1].textContent = monthLabel(month);
      content.appendChild(basic);

      routes.map(getRouteData).forEach((data, index) => {
        const card = document.createElement("section");
        card.className = "surface-card rounded-2xl bg-white p-5";
        const parking = data.parkingType === "利用なし" ? "利用なし" :
          `${data.parkingType}：${data.parkingFee.toLocaleString()}円${data.parkingType === "日払い" ? ` ／ ${data.parkingDays}日` : ""}`;
        const rows = [
          ["利用日", data.dates.map(formatDate).join("、")],
          ["現場", data.siteName],
          ["交通手段", data.transportType],
          ["乗車駅・停留所", data.boardingStation],
          ["降車駅・停留所", data.alightingStation],
          ["片道／往復", data.tripType],
          ["運賃", `${data.fare.toLocaleString()}円`],
          ["駐輪場", parking],
          ["備考", data.remarks || "なし"]
        ];
        const heading = document.createElement("h3");
        heading.className = "font-bold";
        heading.textContent = `現場・経路${toJapaneseNumber(index + 1)}`;
        card.appendChild(heading);
        rows.forEach(([label, value]) => {
          const row = document.createElement("div");
          row.className = "summary-row mt-2";
          const small = document.createElement("span");
          small.className = "text-sm text-slate-500";
          small.textContent = label;
          const p = document.createElement("p");
          p.className = "mt-1 font-semibold break-words";
          p.textContent = value;
          row.append(small, p);
          card.appendChild(row);
        });
        content.appendChild(card);
      });

      $("#form-view").classList.add("hidden-panel");
      $("#review-view").classList.remove("hidden-panel");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function submitApplication() {
      const button = $("#submit-button");
      button.disabled = true;
      button.textContent = "申請を保存しています…";
      $("#submit-error").classList.add("hidden");

      const employee = $("#employee-name").value.trim();
      const targetMonth = monthLabel($("#target-month").value);
      const submittedAt = new Date().toISOString();
      const rows = [];

      routes.map(getRouteData).forEach(data => {
        const usageDates = data.tripType === "定期" ? [data.periodStart] : data.dates;
        usageDates.forEach(date => {
          rows.push({
            submitted_at: submittedAt,
            employee_name: employee,
            target_month: targetMonth,
            site_name: data.siteName,
            usage_date: date,
            transport_type: data.transportType,
            boarding_station: data.boardingStation,
            alighting_station: data.alightingStation,
            trip_type: data.tripType,
            fare: data.fare,
            parking_type: data.parkingType,
            parking_fee: data.parkingFee,
            parking_days: data.parkingDays,
            remarks: data.remarks,
            period_start: data.tripType === "定期" ? data.periodStart : "",
            period_end: data.tripType === "定期" ? data.periodEnd : ""
          });
        });
      });

      try {
        const saved = JSON.parse(localStorage.getItem("transportExpenseSubmissions") || "[]");
        saved.push(...rows);
        localStorage.setItem("transportExpenseSubmissions", JSON.stringify(saved));
        submittedRows = rows;

        $("#review-view").classList.add("hidden-panel");
        $("#complete-view").classList.remove("hidden-panel");
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (error) {
        $("#submit-error").textContent = "申請を保存できませんでした。ブラウザの保存領域を確認してください。";
        $("#submit-error").classList.remove("hidden");
        button.disabled = false;
        button.textContent = "この内容で申請する";
      }
    }

    function csvEscape(value) {
      const text = String(value ?? "");
      return `"${text.replace(/"/g, '""')}"`;
    }

    function downloadCsv() {
      const headers = ["申請日時", "社員名", "精算対象月", "現場名", "利用日", "交通手段", "乗車駅／停留所", "降車駅／停留所", "片道／往復", "運賃", "駐輪場区分", "駐輪場金額", "駐輪場利用日数", "備考"];
      const lines = [headers, ...submittedRows.map(row => [
        row.submitted_at, row.employee_name, row.target_month, row.site_name, formatDate(row.usage_date),
        row.transport_type, row.boarding_station, row.alighting_station, row.trip_type, row.fare,
        row.parking_type, row.parking_fee, row.parking_days, row.remarks
      ])].map(row => row.map(csvEscape).join(","));

      const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `交通費精算申請_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
    }

    $("#target-month").value = initialMonth();
    $("#target-month").addEventListener("change", () => {
      const value = $("#target-month").value;
      routes.forEach(route => {
        if (value) {
          route.displayMonth = value;
          renderCalendar(route);
        }
      });
      clearFieldError($("#basic-info-card").querySelector('[data-field="target_month"]'));
    });
    $("#employee-name").addEventListener("input", () => clearFieldError($("#basic-info-card").querySelector('[data-field="employee_name"]')));
    $("#parking-card").addEventListener("change", event => {
      if (event.target.matches('input[data-group="parking"]')) {
        const type = event.target.value;
        $(".parking-daily", $("#parking-card")).classList.toggle("hidden", type !== "日払い");
        $(".parking-monthly", $("#parking-card")).classList.toggle("hidden", type !== "月額");
        clearFieldError($("#parking-card").querySelector(".choice-wrap"));
      }
    });
    $("#add-route-button").addEventListener("click", addRoute);
    $("#expense-form").addEventListener("submit", event => { event.preventDefault(); showReview(); });
    $("#review-button").addEventListener("click", event => { event.preventDefault(); showReview(); });
    $("#back-button").addEventListener("click", () => {
      $("#review-view").classList.add("hidden-panel");
      $("#form-view").classList.remove("hidden-panel");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    $("#submit-button").addEventListener("click", submitApplication);
    $("#csv-button").addEventListener("click", downloadCsv);

    addRoute();
  </script>
 </body>
</html>
